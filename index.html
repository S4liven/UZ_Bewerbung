// Confetti APi @ https://particles.js.org/

const Confetti = () => {
    const count = 100,
  defaults = {
    origin: { y: 0.7 },
  };

function fire(particleRatio, opts) {
  confetti(
    Object.assign({}, defaults, opts, {
      particleCount: Math.floor(count * particleRatio),
    })
  );
}

fire(0.25, {
  spread: 56,
  startVelocity: 55,
});

fire(0.2, {
  spread: 90,
});

fire(0.35, {
  spread: 140,
  decay: 0.91,
  scalar: 0.8,
});

fire(0.1, {
  spread: 160,
  startVelocity: 25,
  decay: 0.92,
  scalar: 1.2,
});

fire(0.1, {
  spread: 140,
  startVelocity: 45,
});
}

window.onload = function () {
  let count = 0;

  const interval = setInterval(() => {
    confetti();
    count++;

    if (count === 5) {
      clearInterval(interval);
    }
  }, 700); 
};


// Text an Fenstergrösse anpassen.

function updateMargin() { 
  const vh = window.innerHeight;


  // Bereich definieren
  const minVH = 300;
  const maxVH = 1440;
  const minMargin = 0;
  const maxMargin = 300;

  // Fensterhöhe begrenzen
  const clampedVH = Math.max(minVH, Math.min(vh, maxVH));

  // Fortschritt berechnen (zwischen 0 und 1)
  const progress = (clampedVH - minVH) / (maxVH - minVH);

  // Progressiv skalieren (z. B. mit Exponent 2 für stärkere Kurve)
  const curvedProgress = Math.pow(progress, 2);

  // Margin berechnen Punkt vor Strich
  const margin = minMargin + (maxMargin - minMargin) * curvedProgress;


  div.style.margin = margin + 'px'; 
};

window.addEventListener("resize", updateMargin);
window.onresize = updateMargin; 

document.addEventListener("DOMContentLoaded", () => { 
  updateMargin();
});
